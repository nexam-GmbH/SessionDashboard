[package]
name = "session-dashboard"
version = "0.8.17"
description = "Session Dashboard: one place for all your Claude Code sessions"
authors = ["you"]
edition = "2024"
# the app (tauri dev / cargo run); sd-wrap is the terminal sync helper beside it
default-run = "session-dashboard"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "session_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri-plugin-log = "2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# full-text search over every transcript (claude/search.rs): FTS5 trigram index, SQLite built in
rusqlite = { version = "0.43", features = ["bundled"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
listeners = "0.6"
sdwrap = { path = "crates/sdwrap" }
# Claude account tokens in the system's credential store (claude/tokens.rs)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
# the web view's memory level (WebView2 ICoreWebView2_19), same versions tauri/wry use
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# the Rust side's allocator on macOS and Linux (lib.rs, sys::tame_malloc): their malloc kept freed memory
mimalloc = "0.1"

[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.28", default-features = false }

