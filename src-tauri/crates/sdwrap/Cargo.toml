[package]
name = "sdwrap"
version = "0.1.0"
edition = "2024"
description = "Terminal sync wrapper: runs a program in a pseudo-terminal the app can also type into"
publish = false

[dependencies]
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
crossterm = { version = "0.28", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO"] }
