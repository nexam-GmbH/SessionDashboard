# Builds the desktop app for Linux, macOS (Apple silicon and Intel) and Windows on GitHub's runners and
# publishes the installers as a GitHub Release. Runs when a version tag (v0.2.0, …) is pushed, or by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: Session Dashboard v__VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: |
            Desktop app for running many Claude Code sessions at once. Needs [Claude Code](https://code.claude.com) installed and signed in.

            **Downloads**
            - **Linux:** `.AppImage` (any distro: `chmod +x` and run), `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE)
            - **macOS:** `.dmg` (`aarch64` for Apple silicon, `x64` for Intel)
            - **Windows:** `.msi` or the `-setup.exe` installer

            **First start**
            - macOS: the app is not notarized yet. Right-click it in Applications → Open, or run `xattr -dr com.apple.quarantine "/Applications/Session Dashboard.app"`.
            - Windows: the installer is not signed yet. SmartScreen → More info → Run anyway.

            Linux is the main platform. On Windows, the optional hooks (exact states for terminal sessions) are not available yet, and dev-server ports are shown on Linux only.
