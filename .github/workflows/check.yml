# Type checks, lint and the Rust unit tests on every pushed branch (the release workflow only builds).
name: Check

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libdbus-1-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # the app embeds the built frontend (frontendDist), also in a test build
      - run: bun run build
      # left out: tests that need a desktop session (a terminal for screen, file change events, a
      # host name), which a CI runner does not have
      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib -- --skip probe_reads_marked_lines --skip sees_a_new_transcript_and_a_pid_file --skip lists_installed_shells
      # the lockfile as cargo resolved it (a new dependency can be added without a local toolchain)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
